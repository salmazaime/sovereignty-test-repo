# .github/workflows/sovereignty_gate.yml
name: Sovereignty Compliance Gate (IaC)

on:
  push:
    branches: [main]

jobs:
  sovereignty-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Debug API key
        run: |
              echo "API KEY LENGTH: ${#SOVEREIGNTY_API_KEY}"
              echo "API KEY (hex dump):"
              printf '%s' "$SOVEREIGNTY_API_KEY" | hexdump -C
      - name: Run sovereignty IaC gate
        env:
          SOVEREIGNTY_API_URL: ${{ secrets.SOVEREIGNTY_API_URL }}
          SOVEREIGNTY_API_KEY: ${{ secrets.SOVEREIGNTY_API_KEY }}
          SOVEREIGNTY_COMPANY_NAME: ${{ vars.SOVEREIGNTY_COMPANY_NAME }}
          SOVEREIGNTY_COMPANY_SECTOR: ${{ vars.SOVEREIGNTY_COMPANY_SECTOR }}
        run: python -m scripts.run_pipeline_interceptor
      - name: Deploy
        run: echo "Deploying..."
        
